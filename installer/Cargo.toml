[package]
name = "hana_setup"
version = "0.2.0"
edition = "2024"
description = "Instalator aplikacji Hana Control (Redragon M694)"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
